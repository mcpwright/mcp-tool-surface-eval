[project]
name = "mcp-tool-surface-eval"
version = "0.1.0"
description = "Eval harness measuring the tool-surface design claims from the 'good MCP tool surface' essay"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Devender Gollapally" }]
keywords = ["mcp", "model-context-protocol", "claude", "eval", "tool-use"]
dependencies = [
    "anthropic>=0.69.0",
    "pydantic>=2.13.4",
]

[project.scripts]
mcp-tool-surface-eval = "mcp_tool_surface_eval.cli:main"

[project.urls]
Essay = "https://devender.me/2026/06/04/good-mcp-tool-surface/"
Repository = "https://github.com/mcpwright/mcp-tool-surface-eval"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcp_tool_surface_eval"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "pre-commit>=3.6.0",
    "detect-secrets>=1.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "TC", "PTH"]
ignore = ["E501", "B904"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_tool_surface_eval"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src/**/*.py"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short"]
